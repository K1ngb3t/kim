<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoción Activa</title>
    <style>
        /* Reset total para evitar bloqueos de estilos */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0b; /* Fondo oscuro */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal con visibilidad garantizada */
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 30px;
            background-color: #161618; /* Color gris muy oscuro para contraste */
            border: 2px solid #27272a;
            border-radius: 20px;
            box-sizing: border-box;
        }

        /* Título en verde neón */
        h1 {
            color: #00ff88; 
            font-size: 28px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Texto descriptivo */
        p {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Botón de acción principal */
        .btn {
            display: block;
            background-color: #00ff88;
            color: #000000;
            text-decoration: none;
            padding: 20px;
            font-weight: bold;
            font-size: 18px;
            border-radius: 12px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
            transition: transform 0.2s;
            animation: pulse 1.5s infinite;
        }

        /* Animación de latido para que el botón se mueva solo */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .footer {
            margin-top: 25px;
            color: #555555;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BONO ACTIVADO</h1>
        <p>Tu acceso exclusivo ha sido validado. Haz clic en el botón de abajo para reclamar tu premio.</p>
        
        <a href="#" class="btn">ENTRAR AHORA</a>

        <div class="footer">
            Válido solo para hoy • +18 años
        </div>
    </div>

</body>
</html>
