<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoción Especial</title>
    <style>
        /* Estilos Base */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000000; /* Fondo negro sólido para evitar errores de carga */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor con efecto de cristal */
        .main-card {
            width: 90%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(145deg, #1a1a1a, #000000);
            border: 2px solid #333;
            border-radius: 25px;
            box-shadow: 0px 0px 30px rgba(0, 255, 150, 0.1); /* Sutil brillo */
        }

        /* Animación del Título */
        h1 {
            font-size: 24px;
            color: #00ff95; /* Verde neón tipo gaming */
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        p {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* BOTÓN CORREGIDO CON ANIMACIÓN */
        .btn-link {
            display: block;
            background-color: #00ff95;
            color: #000000;
            text-decoration: none;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 149, 0.4);
            animation: expand-contract 2s infinite;
        }

        .btn-link:active {
            transform: scale(0.95);
        }

        /* Animación de latido para el botón */
        @keyframes expand-contract {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(0, 255, 149, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 4px 25px rgba(0, 255, 149, 0.7); }
