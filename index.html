<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoción Exclusiva</title>
    <style>
        /* Reset y Variables de Color */
        :root {
            --primary-bg: #0f172a;
            --accent-gold: #fbbf24;
            --accent-blue: #38bdf8;
            --text-white: #ffffff;
            --button-glow: rgba(251, 191, 36, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor Principal */
        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
            padding: 2rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 var(--button-glow); }
            70% { box-shadow: 0 0 0 15px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Elementos Visuales */
        .logo {
            width: 120px;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            color: #94a3b8;
        }

        /* Botón con Animación Idéntica */
        .cta-button {
            display: inline-block;
            background-color: var(--accent-gold);
            color: #000;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            text-transform: uppercase;
            transition: transform 0.3s ease, background-color 0.3s ease;
            animation: pulse-gold 2s infinite;
        }

        .cta-button:hover {
            transform: scale(1.05);
            background-color: #f59e0b;
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://via.placeholder.com/150x150/fbbf24/000000?text=LOGO" alt="Logo" class="logo">
        
        <h1>¡Bono Exclusivo!</h1>
        <p>Has sido seleccionado para recibir acceso VIP. Haz clic abajo para reclamar tu beneficio ahora mismo.</p>
        
        <a href="TU_ENLACE_AQUI" class="cta-button">Acceder Ahora</a>

        <div class="footer-text">
            * Oferta por tiempo limitado. Solo para mayores de 18 años.
        </div>
    </div>

</body>
</html>
