    <style>
        :root {
            --bg-dark: #0a0a0b;

            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Roboto', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* Contenedor tipo Tarjeta */
        .wrapper {
            width: 100%;
            max-width: 420px;
            padding: 40px 25px;
        }

        /* Estilo del Logo / Icono */
        .brand-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-color), #00b35f);
            border-radius: 20px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
            animation: float 3s ease-in-out infinite;
        }

            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
